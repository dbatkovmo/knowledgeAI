name: Проверка KnowledgeAI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Проверить русскоязычную страницу
        run: |
          grep -q 'lang="ru"' dist/index.html
          test -s dist/knowledge.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверка в Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run dev >/tmp/knowledgeai-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4179/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4179/ >/dev/null
          node scripts/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledgeai-screenshots
          path: artifacts/screens/*.png
          retention-days: 14
          if-no-files-found: warn
